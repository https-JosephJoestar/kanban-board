<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tablero kanban para organizar tareas" />
    <title>Tablero Kanban</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Mis tareas</h1>
      <input id="search" type="search" placeholder="Buscar tarea..." aria-label="Buscar tarea" />
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-title" type="text" placeholder="¿Qué hay que hacer?" maxlength="80" aria-label="Nueva tarea" />
      <select id="task-priority" aria-label="Prioridad">
        <option value="baja">Baja</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
      </select>
      <button type="submit">Agregar</button>
    </form>

    <main class="board">
      <section class="column" data-status="todo">
        <h2>Por hacer <span class="count"></span></h2>
        <ul class="task-list"></ul>
      </section>
      <section class="column" data-status="doing">
        <h2>En progreso <span class="count"></span></h2>
        <ul class="task-list"></ul>
      </section>
      <section class="column" data-status="done">
        <h2>Hecho <span class="count"></span></h2>
        <ul class="task-list"></ul>
      </section>
    </main>

    <template id="task-template">
      <li class="task" draggable="true">
        <div class="task-top">
          <span class="priority"></span>
          <button class="delete" type="button" aria-label="Borrar tarea">✕</button>
        </div>
        <p class="task-title" title="Doble clic para editar"></p>
        <div class="task-moves">
          <button class="move-left" type="button" aria-label="Mover a la columna anterior">←</button>
          <button class="move-right" type="button" aria-label="Mover a la siguiente columna">→</button>
        </div>
      </li>
    </template>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
